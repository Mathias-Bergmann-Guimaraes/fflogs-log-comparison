# A character's FF Logs id, exact name and server, to check a pasted link points at one
query CharacterLookup($id: Int, $name: String, $serverSlug: String, $serverRegion: String) {
  characterData {
    character(id: $id, name: $name, serverSlug: $serverSlug, serverRegion: $serverRegion) {
      id
      name
      server {
        slug
        region {
          slug
        }
      }
    }
  }
}
