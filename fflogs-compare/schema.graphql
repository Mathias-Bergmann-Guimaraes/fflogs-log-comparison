  """
  The actual completion percentage of the fight. This is the field used to
  indicate how far into a fight a wipe was, since fights can be complicated and
  have multiple bosses, no bosses, bosses that heal, etc.
  """
  fightPercentage: Float

  """
  Information about friendly NPCs involved in the fight. Includes report IDs,
  instance counts, and instance group counts for each NPC.
  """
  friendlyNPCs: [ReportFightNPC]

  """
  Information about friendly pets involved in the fight. Includes report IDs,
  instance counts, and instance group counts for each pet.
  """
  friendlyPets: [ReportFightNPC]

  """
  The IDs of all players involved in a fight. These players can be referenced in
  the master data actors table to get detailed information about each participant.
  """
  friendlyPlayers: [Int]

  """
  The game zone the fight takes place in. This should not be confused with the
  zones used by the sites for rankings. This is the actual in-game zone info.
  """
  gameZone: GameZone

  """Whether or not the fight had Echo present."""
  hasEcho: Boolean

  """
  The report ID of the fight. This ID can be used to fetch only events, tables or
  graphs for this fight.
  """
  id: Int!

  """
  Whether or not the fight is still in progress. If this field is false, it means
  the entire fight has been uploaded.
  """
  inProgress: Boolean

  """
  Whether or not the fight was a boss kill, i.e., successful. If this field is
  false, it means the fight was a wipe or a failed run, etc..
  """
  kill: Boolean

  """
  The phase that the encounter was in when the fight ended. Counts up from 1 based
  off the phase type (i.e., normal phase vs intermission).
  """
  lastPhase: Int

  """
  The phase that the encounter was in when the fight ended. Always increases from
  0, so a fight with three real phases and two intermissions would count up from 0
  to 4.
  """
  lastPhaseAsAbsoluteIndex: Int

  """
  Whether or not the phase that the encounter was in when the fight ended was an
  intermission or not.
  """
  lastPhaseIsIntermission: Boolean

  """
  All the maps that were involved in a fight. For single bosses this will usually
  be a single map, but for dungeons it will typically be multiple maps.
  """
  maps: [ReportMap]

  """The name of the fight."""
  name: String!

  """
  Some boss fights may be converted to trash fights (encounterID = 0). When this
  occurs, `originalEncounterID` contains the original ID of the encounter.
  """
  originalEncounterID: Int

  """List of observed phase transitions during the fight."""
  phaseTransitions: [PhaseTransition!]

  """The group size for the raid, dungeon, or arena. Null for trash."""
  size: Int

  """
  Whether or not the fight used a standard composition, which is defined as two
  tanks, two healers, four damage dealers, and no more than two of any job.
  """
  standardComposition: Boolean

  """
  The start time of the fight. This is a timestamp with millisecond precision that
  is relative to the start of the report, i.e., the start of the report is
  considered time 0.
  """
  startTime: Float!

  """
  If a wipe was explicitly called using the Companion app, then this field will
  contain the time. This is a timestamp with millisecond precision that is
  relative to the start of the report, i.e., the start of the report is considered
  time 0.
  """
  wipeCalledTime: Float
}

type ReportFightNPC {
  """
  The game ID of the actor. This ID is used in events to identify sources and
  targets.
  """
  gameID: Int

  """
  The report ID of the actor. This ID is used in events to identify sources and
  targets.
  """
  id: Int

  """How many instances of the NPC were seen during the fight."""
  instanceCount: Int

  """How many packs of the NPC were seen during the fight."""
  groupCount: Int

  """
  The report ID of the actor that owns this NPC (if it is a pet). This ID is used
  in events to identify sources and targets.
  """
  petOwner: Int
}

type ReportMap {
  """The map's game ID."""
  id: Int!
}

type ReportMapBoundingBox {
  """The smallest X position."""
  minX: Int!

  """The largest X position."""
  maxX: Int!

  """The smallest Y position."""
  minY: Int!

  """The largest Y position."""
  maxY: Int!
}

type ReportMasterData {
  """
  The version of the client parser that was used to parse and upload this log
  file.
  """
  logVersion: Int!

  """
  The version of the game that generated the log file. Used to distinguish Classic
  and Retail Warcraft primarily.
  """
  gameVersion: Int

  """
  The auto-detected locale of the report. This is the source language of the
  original log file.
  """
  lang: String

  """A list of every ability that occurs in the report."""
  abilities: [ReportAbility]

  """
  A list of every actor (player, NPC, pet) that occurs in the report.
  
  Arguments
  type: Optional. A filter on the actors in a report. If the type
  field of the actor matches the specified type field, it will be included.
  subType: Optional. A filter on the actors in a report. If the
  subType field of the actor matches the specified subType field, it will be
  included.
  """
  actors(type: String, subType: String): [ReportActor]
}

type ReportPagination {
  """List of items on the current page"""
  data: [Report]

  """Number of total items selected by the query"""
  total: Int!

  """Number of items returned per page"""
  per_page: Int!

  """Current page of the cursor"""
  current_page: Int!

  """Number of the first item returned"""
  from: Int

  """Number of the last item returned"""
  to: Int

  """The last page (number of pages)"""
  last_page: Int!

  """Determines if cursor has more pages after the current page"""
  has_more_pages: Boolean!
}

type Server {
  """The ID of the server."""
  id: Int!

  """
  The name of the server in the locale of the subregion that the server belongs
  to.
  """
  name: String!

  """
  The normalized name is a transformation of the name, dropping spaces. It is how
  the server appears in a World of Warcraft log file.
  """
  normalizedName: String!

  """
  The server slug, also a transformation of the name following Blizzard rules. For
  retail World of Warcraft realms, this slug will be in English. For all other
  games, the slug is just a transformation of the name field.
  """
  slug: String!

  """The region that this server belongs to."""
  region: Region!

  """The subregion that this server belongs to."""
  subregion: Subregion!

  """
  The guilds found on this server (and any servers connected to this one.
  
  Arguments
  limit: Optional. The number of guilds to retrieve per page. The
  maximum allowed value is 100, and minimum allowed value is 1.
  page: Optional. The page of paginated data to retrieve. If
  omitted, defaults to the first page.
  """
  guilds(limit: Int, page: Int): GuildPagination

  """
  The characters found on this server (and any servers connected to this one.
  
  Arguments
  limit: Optional. The number of characters to retrieve per page.
  The maximum allowed value is 100, and minimum allowed value is 1.
  page: Optional. The page of paginated data to retrieve. If
  omitted, defaults to the first page.
  """
  characters(limit: Int, page: Int): CharacterPagination
}

type ServerPagination {
  """List of items on the current page"""
  data: [Server]

  """Number of total items selected by the query"""
  total: Int!

  """Number of items returned per page"""
  per_page: Int!

  """Current page of the cursor"""
  current_page: Int!

  """Number of the first item returned"""
  from: Int

  """Number of the last item returned"""
  to: Int

  """The last page (number of pages)"""
  last_page: Int!

  """Determines if cursor has more pages after the current page"""
  has_more_pages: Boolean!
}

type Subregion {
  """The ID of the subregion."""
  id: Int!

  """The localized name of the subregion."""
  name: String!

  """The region that this subregion is found in."""
  region: Region!

  """
  The servers found within this region.
  
  Arguments
  limit: Optional. The number of servers to retrieve per page. If
  omitted, defaults to 100. The maximum allowed value is 100, and minimum allowed
  value is 1.
  page: Optional. The page of paginated data to retrieve. If
  omitted, defaults to the first page.
  """
  servers(limit: Int, page: Int): ServerPagination
}

type User {
  """The ID of the user."""
  id: Int!

  """The name of the user."""
  name: String!

  """The avatar of the user, typically the main character avatar."""
  avatar: String!

  """
  The list of guilds to which the user belongs. Only accessible via user
  authentication when you have the "view-user-profile" scope.
  """
  guilds: [Guild]

  """
  The characters claimed by this user. Only accessible via user authentication
  when you have the "view-user-profile" scope.
  """
  characters: [Character]
}

type UserData {
  """
  Obtain a specific user by id.
  
  Arguments
  id: Required. Specify a single user ID to retrieve.
  """
  user(id: Int): User

  """Obtain the current user (only works with user endpoint)."""
  currentUser: User
}

type WorldData {
  """
  Obtain a specific encounter by id.
  
  Arguments
  id: Required. Specify a single encounter ID to retrieve.
  """
  encounter(id: Int): Encounter

  """
  A single expansion obtained by ID.
  
  Arguments
  id: Required. The ID of a single expansion to retrieve.
  """
  expansion(id: Int): Expansion

  """The set of all expansions supported by the site."""
  expansions: [Expansion]

  """
  Obtain a specific region by its ID.
  
  Arguments
  id: Required. The ID of a single region to retrieve.
  """
  region(id: Int): Region

  """The set of all regions supported by the site."""
  regions: [Region]

  """
  Obtain a specific server either by id or by slug and region.
  
  Arguments
  id: Optional. The ID of a single server to retrieve.
  region: Optional. The compact English abbreviation for a
  specific region (e.g., "US"). Use in conjunction with the server slug to
  retrieve a single server.
  slug: Optional. A server slug. Use in conjunction with the
  server region to retrieve a single server.
  """
  server(id: Int, region: String, slug: String): Server

  """
  Obtain a specific subregion by its ID.
  
  Arguments
  id: Required. The ID of a single subregion to retrieve.
  """
  subregion(id: Int): Subregion

  """
  Obtain a specific zone by its ID.
  
  Arguments
  id: Required. The ID of a specific zone.
  """
  zone(id: Int): Zone

  """
  Obtain a set of all zones supported by the site.
  
  Arguments
  expansion_id: Optional. The ID of a specific expansion. If
  omitted, the zones from all expansions will be retrieved.
  """
  zones(expansion_id: Int): [Zone]
}

type WorldRegionServerRankPositions {
  worldRank: Rank
  regionRank: Rank
  serverRank: Rank
}

type Zone {
  """The ID of the zone."""
  id: Int!

  """
  The bracket information for this zone. This field will be null if the zone does
  not support brackets.
  """
  brackets: Bracket

  """A list of all the difficulties supported for this zone."""
  difficulties: [Difficulty]

  """The encounters found within this zone."""
  encounters: [Encounter]

  """The expansion that this zone belongs to."""
  expansion: Expansion!

  """
  Whether or not the entire zone (including all its partitions) is permanently
  frozen. When a zone is frozen, data involving that zone will never change and
  can be cached forever.
  """
  frozen: Boolean!

  """The name of the zone."""
  name: String!

  """A list of all the partitions supported for this zone."""
  partitions: [Partition]
}

input ReportComponentFilter {
  """Filter input events to those from these fight IDs."""
  fightIDs: [Int!]

  """
  Filter input events to those that include the `actorID` and their pets.
  """
  actorID: Int

  """Filter input events to those within this range."""
  timestampRange: ReportComponentRangeFilter

  """
  Filter input events to those from fights having this encounter ID. 0 is used for
  trash fights and very short boss pulls (typically less than 20s).
  """
  encounterID: Int

  """
  Filter input events to a specific phase index. Note that if multiple different
  encounters are included, the phase index will be applied to *each encounter
  separately* which is probably not what you want.
  """
  phase: Int

  """
  Filter input events to only those prior to the `deathCutoff`-th death in each
  fight.
  
  ## Special Values
  
  - End after a Called Wipe: -1
  """
  deathCutoff: Int

  """
  Filter to only include kills, wipes, encounters, or trash. Note: if set to
  `Trash`, this will override `encounterID`.
  """
  killType: KillType

  """
  Filter to fights that have the specified difficulty ID. Difficulty IDs are game-
  and sometimes zone-specific. Use the `difficulties` field of a `Zone` object to
  retrieve a list of all valid IDs. Trash does not have a difficulty.
  """
  difficulty: Int
}

input ReportComponentRangeFilter {
  """The report-relative start time, in milliseconds."""
  startTime: Int!

  """The report-relative end time, in milliseconds."""
  endTime: Int!
}

input ReportComponentSelectorInput {
  surface: ReportComponentSelectorSurface!
  areaId: Int
  seasonId: Int
  encounterId: Int
  className: String
  specName: String
  difficultyId: Int
}
